<template>
    <lightning-card>
        <img src={logo} class="logo" />
        <div lwc:if={showForm} class="slds-grid slds-grid_align-center slds-gutters_medium slds-wrap fullWidth">
            <div class="slds-col slds-size_1-of-3 slds-medium-size_1-of-3 slds-small-size_1-of-1 
                slds-x-small-size_1-of-1 slds-float_left">
                <h3 class="slds-p-bottom_small slds-p-top_small slds-p-around_small eventTitle">{eventData.Name}</h3>
                <div class="textFont slds-p-around_small">
                    <div class=""><strong>Host: </strong>{eventData.Host__r.Name}</div>
                    <div class=""><strong>Address: </strong>{eventData.Address__c}</div>                    
                    <div class=""><strong>Date/Time: </strong>
                        <lightning-formatted-date-time class="slds-p-right_small" value={eventData.Date__c} year="numeric" 
                            month="short" day="2-digit">
                        </lightning-formatted-date-time>
                        <div class="timezone">{dateTimeStr} hrs</div>
                        <div class="timezone"> {eventData.Time_ZoneStr__c}</div>
                    </div>
                    <div class=""><strong>Duration: </strong>{eventData.Duration__c} {eventData.Minutes_Or_Hours__c}</div>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-3 slds-medium-size_1-of-3 slds-small-size_1-of-1 slds-x-small-size_1-of-1 slds-float_left">
                <div class="textFont">
                    <h3 class="slds-text-heading_large slds-p-around_small">Register for Meeting</h3>
                    <div class="slds-p-around_small">
                        <lightning-input class="slds-text-title_bold" type="text" label="First Name" value={guestFirstName} onchange={handleFirstName} placeholder="First Name" required></lightning-input>
                        <lightning-input class="slds-text-title_bold" type="text" label="Last Name" value={guestLastName} onchange={handleLastName} placeholder="Last Name" required></lightning-input>
                        <lightning-input class="slds-text-title_bold" type="email" label="Email" value={guestEmail} onchange={handleEmail} placeholder="Email" required></lightning-input>
                        <template for:each={questions} for:item="question" for:index="index">
                            <div lwc:if={question} key={question.Id}>
                                <div lwc:if={question.isOpenText}>
                                    <lightning-input class="inputTitle" type='text' required={question.Required__c} onchange={handleAnswer} label={question.Name}
                                        data-id={question.Id} data-index={index}></lightning-input>
                                </div>
                                
                                <div lwc:if={question.isCheckbox}>
                                    <lightning-input class="inputTitle"
                                        onchange={handleAnswer} type="Checkbox" value={question.checked} label={question.Name}
                                        required={question.Required__c} data-id={question.Id} data-index={index}></lightning-input>
                                </div>
                                
                                <div lwc:if={question.isPicklist}>
                                    <lightning-combobox class="inputTitle" placeholder="Select one" options={question.Options} onchange={handleAnswer} 
                                    label={question.Name} required={question.Required__c} data-id={question.Id} data-index={index} ></lightning-combobox>
                                </div>
                            </div>
                        </template>
                    </div>
                    <div class="buttonDiv slds-p-left_small slds-p-right_small">
                        <lightning-button class={disabledClass} label="Register" onclick={handleSubmit} variant="brand" disabled={disabled}></lightning-button>
                    </div>
                </div>
            </div>    
        </div>
        <div lwc:if={successRegistration}>
            <div class="roundBorder slds-align_absolute-center">
                <lightning-icon class="" icon-name="action:approval" size="large"></lightning-icon>
            </div>
            <h3 class="slds-p-bottom_small slds-p-top_small eventTitle slds-align_absolute-center">Meeting Invite Confirmed</h3>
            <div class="slds-align_absolute-center slds-p-around_small">{response}</div>
            <div class="slds-p-bottom_small slds-p-top_small slds-align_absolute-center">
                <button class="slds-button slds-button_neutral" onclick={downloadICSFile}>
                    <svg width="50px" height="50px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M16.7502 3.56V2C16.7502 1.59 16.4102 1.25 16.0002 1.25C15.5902 1.25 15.2502 1.59 15.2502 2V3.5H8.75024V2C8.75024 1.59 8.41024 1.25 8.00024 1.25C7.59024 1.25 7.25024 1.59 7.25024 2V3.56C4.55024 3.81 3.24023 5.42 3.04023 7.81C3.02023 8.1 3.26023 8.34 3.54023 8.34H20.4602C20.7502 8.34 20.9902 8.09 20.9602 7.81C20.7602 5.42 19.4502 3.81 16.7502 3.56Z" fill="#292D32"/>

                        <path d="M21.83 16.17C20.27 14.61 17.73 14.61 16.17 16.17C14.61 17.73 14.61 20.27 16.17 21.83C17.73 23.39 20.27 23.39 21.83 21.83C23.39 20.27 23.39 17.73 21.83 16.17ZM21.07 19.56C20.94 19.7 20.75 19.78 20.54 19.78H19.8V20.56C19.8 20.77 19.72 20.95 19.58 21.09C19.44 21.23 19.26 21.31 19.05 21.31C18.64 21.31 18.3 20.97 18.3 20.56V19.78H17.55C17.14 19.78 16.8 19.45 16.8 19.03C16.8 18.62 17.14 18.28 17.55 18.28H18.3V17.57C18.3 17.16 18.63 16.82 19.05 16.82C19.46 16.82 19.8 17.16 19.8 17.57V18.28H20.54C20.96 18.28 21.29 18.62 21.29 19.03C21.29 19.24 21.21 19.43 21.07 19.56Z" fill="#292D32"/>
                        </svg>
                    {label.downloadics}
                </button>
            </div>
            <div class="slds-p-bottom_small slds-p-top_small slds-align_absolute-center">
                <button class="slds-button" onclick={openlinkGoogle}>
                    <svg width="50px" height="50px" viewBox="7.086 -169.483 1277.149 1277.149" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" image-rendering="optimizeQuality" xmlns="http://www.w3.org/2000/svg"><path fill="none" d="M1138.734 931.095h.283M1139.017 931.095h-.283"/><path d="M1179.439 7.087c57.543 0 104.627 47.083 104.627 104.626v30.331l-145.36 103.833-494.873 340.894L148.96 242.419v688.676h-37.247c-57.543 0-104.627-47.082-104.627-104.625V111.742C7.086 54.198 54.17 7.115 111.713 7.115l532.12 394.525L1179.41 7.115l.029-.028z" fill="#e75a4d"/><linearGradient id="a" gradientUnits="userSpaceOnUse" x1="1959.712" y1="737.107" x2="26066.213" y2="737.107" gradientTransform="matrix(.0283 0 0 -.0283 248.36 225.244)"><stop offset="0" stop-color="#f8f6ef"/><stop offset="1" stop-color="#e7e4d6"/></linearGradient><path fill="url(#a)" d="M111.713 7.087l532.12 394.525L1179.439 7.087z"/><path fill="#e7e4d7" d="M148.96 242.419v688.676h989.774V245.877L643.833 586.771z"/><path fill="#b8b7ae" d="M148.96 931.095l494.873-344.324-2.24-1.586L148.96 923.527z"/><path fill="#b7b6ad" d="M1138.734 245.877l.283 685.218-495.184-344.324z"/><path d="M1284.066 142.044l.17 684.51c-2.494 76.082-35.461 103.238-145.219 104.514l-.283-685.219 145.36-103.833-.028.028z" fill="#b2392f"/><linearGradient id="b" gradientUnits="userSpaceOnUse" x1="1959.712" y1="737.107" x2="26066.213" y2="737.107" gradientTransform="matrix(.0283 0 0 -.0283 248.36 225.244)"><stop offset="0" stop-color="#f8f6ef"/><stop offset="1" stop-color="#e7e4d6"/></linearGradient><path fill="url(#b)" d="M111.713 7.087l532.12 394.525L1179.439 7.087z"/><linearGradient id="c" gradientUnits="userSpaceOnUse" x1="1959.712" y1="737.107" x2="26066.213" y2="737.107" gradientTransform="matrix(.0283 0 0 -.0283 248.36 225.244)"><stop offset="0" stop-color="#f8f6ef"/><stop offset="1" stop-color="#e7e4d6"/></linearGradient><path fill="url(#c)" d="M111.713 7.087l532.12 394.525L1179.439 7.087z"/><linearGradient id="d" gr                     Add to Google
                </button>
                <button class="slds-button" onclick={openlinkOutlook}>
                    <svg width="50px" height="50px" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><title>file_type_outlook</title><path d="M19.484,7.937v5.477L21.4,14.619a.489.489,0,0,0,.21,0l8.238-5.554a1.174,1.174,0,0,0-.959-1.128Z" style="fill:#0072c6"/><path d="M19.484,15.457l1.747,1.2a.522.522,0,0,0,.543,0c-.3.181,8.073-5.378,8.073-5.378V21.345a1.408,1.408,0,0,1-1.49,1.555H19.483V15.457Z" style="fill:#0072c6"/><path d="M10.44,12.932a1.609,1.609,0,0,0-1.42.838,4.131,4.131,0,0,0-.526,2.218A4.05,4.05,0,0,0,9.02,18.2a1.6,1.6,0,0,0,2.771.022,4.014,4.014,0,0,0,.515-2.2,4.369,4.369,0,0,0-.5-2.281A1.536,1.536,0,0,0,10.44,12.932Z" style="fill:#0072c6"/><path d="M2.153,5.155V26.582L18.453,30V2ZM13.061,19.491a3.231,3.231,0,0,1-2.7,1.361,3.19,3.19,0,0,1-2.64-1.318A5.459,5.459,0,0,1,6.706,16.1a5.868,5.868,0,0,1,1.036-3.616A3.267,3.267,0,0,1,10.486,11.1a3.116,3.116,0,0,1,2.61,1.321,5.639,5.639,0,0,1,1,3.484A5.763,5.763,0,0,1,13.061,19.491Z" style="fill:#0072c6"/></svg>
                    Add to Outlook
                </button>
                <button class="slds-button" onclick={openlinkOffice}>
                    <svg width="50px" height="50px" viewBox="-212.4 0 2499.8 2499.8" enable-background="new 0 0 2075 2499.8" xmlns="http://www.w3.org/2000/svg"><path d="m0 2016.6v-1519.8l1344.4-496.8 730.6 233.7v2045.9l-730.6 220.3-1344.4-483.3 1344.4 161.8v-1769.2l-876.8 204.6v1198.3z" fill="#eb3c00"/></svg>
                    Add to Office365
                </button>
            </div>
        </div>
        <div lwc:if={eventClosed}>
            <div class="slds-align_absolute-center">
                <lightning-icon class="" icon-name="action:close" size="large"></lightning-icon>
            </div>
            <h3 class="slds-p-bottom_small slds-p-top_small eventTitle slds-align_absolute-center">Registrations Closed</h3>
            <div class="slds-align_absolute-center slds-p-around_small">Sorry, the registrations for {eventData.Name} are closed.</div>
        </div>
        <div lwc:if={noEventFound}>
            <div class="slds-align_absolute-center">
                <lightning-icon class="" icon-name="action:close" size="large"></lightning-icon>
            </div>
            <h3 class="slds-p-bottom_small slds-p-top_small eventTitle slds-align_absolute-center">Event not found</h3>
            <div class="slds-align_absolute-center slds-p-around_small">Sorry, we can not found the event registration.</div>
        </div>
    </lightning-card>
</template>
